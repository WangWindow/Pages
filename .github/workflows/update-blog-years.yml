name: Update Blog Years

on:
  schedule:
    - cron: "0 1 1 1 *" # Jan 1st at 01:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update BLOG_YEARS
        run: |
          YEAR=$(date +%Y)
          CONFIG_FILE="keystatic.config.ts"

          if grep -q "\"$YEAR\"" "$CONFIG_FILE"; then
            echo "Year $YEAR already exists"
            exit 0
          fi

          sed -i "s/const BLOG_YEARS = \[\"/const BLOG_YEARS = [\"$YEAR\", \"/" "$CONFIG_FILE"
          echo "Added year $YEAR"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystatic.config.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add $YEAR to blog years"
            git push
          fi
