backend:
  name: github
  repo: WangWindow/Blogs
  branch: main
  base_url: https://wangwindow.pages.dev
  auth_endpoint: /api/auth

# 媒体文件存储在 Blogs 仓库的 uploads 目录
media_folder: "uploads"
public_folder: "/uploads"

# 站点配置
site_url: https://wangwindow.pages.dev
display_url: https://wangwindow.pages.dev
logo_url: https://wangwindow.pages.dev/img/avatar.webp

# 本地开发模式（取消注释以启用）
# local_backend: true

# 语言设置
locale: "zh_Hans"

# Slug 配置
slug:
  encoding: "unicode"
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "博客文章"
    folder: "posts"
    create: true
    slug: "{{year}}/{{slug}}/index"
    media_folder: ""
    public_folder: "./"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: true
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "年份"
        field: "date"
        pattern: \d{4}
    summary: "{{title}} - {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "封面图片", name: "cover", widget: "image", required: false, choose_url: true }
      - label: "分类"
        name: "categories"
        widget: "list"
        allow_add: true
        required: false
        field: { label: "分类", name: "category", widget: "string" }
      - label: "标签"
        name: "tags"
        widget: "list"
        allow_add: true
        required: false
        field: { label: "标签名", name: "tag", widget: "string" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "置顶", name: "sticky", widget: "boolean", default: false, required: false }
      - { label: "摘要", name: "summary", widget: "text", required: false, hint: "AI 生成或手动编写的文章摘要" }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "weekly"
    label: "周刊"
    folder: "posts/weekly"
    create: true
    slug: "{{year}}-{{month}}-{{day}}/index"
    media_folder: ""
    public_folder: "./"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: true
    sortable_fields: ["date", "title"]
    summary: "{{title}} - {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "封面图片", name: "cover", widget: "image", required: false }
      - label: "分类"
        name: "categories"
        widget: "hidden"
        default: ["周刊"]
      - label: "标签"
        name: "tags"
        widget: "list"
        allow_add: true
        required: false
        field: { label: "标签", name: "tag", widget: "string" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "摘要", name: "summary", widget: "text", required: false }
      - { label: "正文", name: "body", widget: "markdown" }
